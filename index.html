<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裕德高中游泳隊 全國北區A(2)游泳錦標賽 賽程</title>
<meta name="description" content="裕德高中游泳隊在115年全國北區A(2)游泳錦標賽的項次、組別、水道與報名成績，可依日期、性別、姓名篩選，並下載 PDF 或圖片。">
<style>
:root{
  --ink:#08304f;      /* 深水 */
  --tile:#16a6b6;     /* 池磚 */
  --teal:#0a7885;     /* 文字用的深池磚色 */
  --foam:#eef6f7;     /* 池畔 */
  --rope:#f5c400;     /* 水道線浮球黃 */
  --buoy:#e5484d;     /* 浮球紅 */
  --line:#cfe3e6;
  --muted:#556d7e;
  --male-bg:#e3edfc; --male-fg:#1a4fb0;
  --female-bg:#fde6ee; --female-fg:#b01f55;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--foam);color:#12283a;
  font:16px/1.55 "PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* ── 頁首 ── */
.masthead{background:var(--ink);color:#fff;padding:30px 0 24px}
.masthead h1{margin:0;font-size:clamp(28px,5.4vw,46px);line-height:1.15;font-weight:800;letter-spacing:.03em}
.masthead .meet{margin:8px 0 0;font-size:clamp(15px,2.4vw,18px);color:#cfeaee}
.masthead .sum{margin:6px 0 0;font-size:14px;color:#8fc9d1}
.rope{
  height:14px;background-color:var(--ink);
  background-image:
    radial-gradient(circle at 7px 7px,var(--rope) 5.5px,#0000 6px),
    radial-gradient(circle at 21px 7px,#fff 5.5px,#0000 6px),
    radial-gradient(circle at 35px 7px,var(--buoy) 5.5px,#0000 6px);
  background-size:42px 14px;background-repeat:repeat-x;
}

/* ── 篩選列 ── */
.filters{background:#fff;border-bottom:1px solid var(--line)}
@media(min-width:721px){.filters{position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line)}}
.filters .wrap{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;padding-top:14px;padding-bottom:14px}
.grp .t{display:block;margin:0 0 5px;font-size:13px;font-weight:700;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.seg button{
  border:0;border-right:1.5px solid var(--ink);background:#fff;color:var(--ink);
  padding:8px 14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;line-height:1.3;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button small{font-size:12px;font-weight:500;margin-left:6px;opacity:.75}
.namebox{position:relative}
.namebox input{
  width:210px;height:40px;border:1.5px solid var(--ink);border-radius:10px;
  padding:0 36px 0 12px;font:inherit;font-size:16px;color:#12283a;background:#fff;
}
.namebox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.namebox .x{
  position:absolute;right:4px;top:4px;width:32px;height:32px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;
}
.namebox .x[hidden]{display:none}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{
  height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);
  background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer;
}
.btn.pri{background:var(--rope)}
.btn.quiet{border-color:var(--line);color:var(--muted);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--tile);outline-offset:2px}
.seg button:hover:not([aria-pressed="true"]){background:#e6f3f5}
.btn:active,.seg button:active{transform:translateY(1px)}

/* ── 結果 ── */
main.wrap{padding-top:18px;padding-bottom:40px}
.bar{display:flex;align-items:center;gap:14px;min-height:34px;margin-bottom:4px;font-size:15px;color:var(--muted)}
.bar b{color:var(--ink)}
.linkbtn{border:0;background:none;padding:4px 2px;font:inherit;font-size:15px;font-weight:700;color:var(--teal);text-decoration:underline;cursor:pointer}
.day{margin:22px 0 0}
.day h2{
  display:flex;align-items:baseline;gap:12px;margin:0 0 10px;padding-bottom:6px;
  border-bottom:3px solid var(--ink);
}
.day .dd{font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.day .wd{font-size:17px;font-weight:700;color:var(--teal)}
.day .n{margin-left:auto;font-size:14px;color:var(--muted)}

.sched{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sched th{background:#dff0f2;color:var(--ink);text-align:left;font-size:14px;font-weight:700;padding:9px 12px;white-space:nowrap}
.sched td{padding:10px 12px;border-top:1px solid #e3eef0;vertical-align:middle}
.sched tbody tr:first-child td{border-top:0}
.sched .no{width:58px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.sched .ev b{display:block;font-size:17px;line-height:1.3}
.sched .ev .sub{display:block;margin-top:2px;font-size:14px;color:#3c5568}
.sx{display:inline-block;margin-left:6px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:700;line-height:1.6}
.sx.m{background:var(--male-bg);color:var(--male-fg)}
.sx.f{background:var(--female-bg);color:var(--female-fg)}
.sched .ht{white-space:nowrap;font-variant-numeric:tabular-nums}
.sched .ht small{display:block;font-size:12px;color:var(--muted)}
.plate{
  display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 6px;
  background:var(--ink);color:#fff;font-weight:800;font-size:17px;border-radius:8px;
  border-top:4px solid var(--rope);font-variant-numeric:tabular-nums;
}
.sched .nm{font-size:17px;font-weight:800}
.sched .nm.relay{font-weight:700;color:var(--teal)}
.sched .tm{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sched .tm.odd{color:#8fa0ad;font-weight:500}
.empty{margin:40px 0;padding:34px 20px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty b{display:block;margin-bottom:6px;font-size:18px;color:var(--ink)}
.foot{margin-top:34px;font-size:13px;color:var(--muted)}
.foot p{margin:4px 0}
.foot a{color:var(--teal)}

/* ── 手機：每一列變成一張小卡 ── */
@media(max-width:720px){
  .wrap{padding:0 14px}
  .masthead{padding:22px 0 18px}
  .filters .wrap{gap:12px}
  .grp{width:100%}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:7px 4px;text-align:center}
  .seg button small{display:block;margin:0}
  .namebox input{width:100%}
  .actions{margin-left:0;width:100%}
  .actions .btn{flex:1}
  .sched{background:none;border:0;border-radius:0}
  .sched thead{display:none}
  .sched tbody{display:block}
  .sched tr{
    display:grid;grid-template-columns:46px 1fr auto;column-gap:12px;row-gap:1px;
    grid-template-areas:"no ev ln" "no nm ht" "no tm ht";
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;
  }
  .sched td{display:block;padding:0;border:0}
  .sched .no{grid-area:no;display:grid;place-items:center;width:auto;background:#eaf3f5;border-radius:8px;font-size:17px;color:var(--ink)}
  .sched .ev{grid-area:ev}
  .sched .ln{grid-area:ln;justify-self:end;align-self:start}
  .sched .ln::before{content:"水道";margin-right:6px;font-size:12px;color:var(--muted)}
  .sched .nm{grid-area:nm;margin-top:6px}
  .sched .tm{grid-area:tm;text-align:left}
  .sched .tm::before{content:"報名 ";font-weight:500;color:var(--muted)}
  .sched .ht{grid-area:ht;align-self:end;text-align:right;font-weight:700}
}

/* ── 輸出用畫面（固定寬度，不受手機版面影響）── */
.ex-stage{position:absolute;top:0;left:0;width:1000px;z-index:1}
.ex{width:1000px;background:#fff;color:#12283a;font:15px/1.5 "PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif}
.ex-head{background:#08304f;color:#fff;padding:26px 30px 20px}
.ex-t{font-size:32px;font-weight:800;letter-spacing:.03em}
.ex-s{margin-top:4px;font-size:17px;color:#cfeaee}
.ex-f{margin-top:8px;font-size:14px;color:#8fc9d1}
.ex-rope{height:10px;background:repeating-linear-gradient(90deg,#f5c400 0 14px,#ffffff 14px 28px,#e5484d 28px 42px)}
.ex-tb{width:100%;border-collapse:collapse;table-layout:fixed}
.ex-tb th{background:#dff0f2;color:#08304f;font-size:14px;font-weight:700;text-align:left;padding:9px 10px}
.ex-tb td{padding:8px 10px;border-top:1px solid #e3eef0;font-size:15px;vertical-align:middle;word-break:break-all}
.ex-tb tr.day td{background:#08304f;color:#fff;font-size:16px;font-weight:800;padding:9px 12px;border-top:0}
.ex-tb tr.day td span{font-weight:500;font-size:13px;color:#8fc9d1;margin-left:10px}
.ex-tb tr.z td{background:#f6fafb}
.ex-tb .c-no{font-weight:800;color:#556d7e}
.ex-tb .c-it{font-weight:800}
.ex-tb .c-ln{font-weight:800;font-size:16px}
.ex-tb .c-nm{font-weight:800}
.ex-tb .c-tm{font-weight:700;text-align:right;padding-right:16px}
.ex-tb .odd{color:#8fa0ad;font-weight:500}
.ex-tb .m{color:#1a4fb0;font-weight:700}
.ex-tb .f{color:#b01f55;font-weight:700}
.ex-note{padding:14px 30px 20px;font-size:12px;color:#556d7e;border-top:1px solid #e3eef0}

#busy{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(8,48,79,.94);color:#fff;font-size:18px;font-weight:700;text-align:center;padding:20px}
#busy[hidden]{display:none}
#busy small{display:block;margin-top:8px;font-size:14px;font-weight:500;color:#9fd3da}

@media print{
  .filters,.rope,#busy,#stage,.actions,.linkbtn{display:none!important}
  body{background:#fff}
  .masthead{background:#fff;color:#000;padding:0 0 8px}
  .masthead .meet,.masthead .sum{color:#333}
  .sched tr{break-inside:avoid}
  .sched thead{display:table-header-group}
  .day{break-inside:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const ROWS = DATA.map(a => ({
  date:a[0], md:a[0].slice(4), no:a[1], age:a[2], sex:a[3], item:a[4],
  tot:a[5], heat:a[6], lane:a[7], name:a[8], time:a[9]
}));
const RELAY = '（接力隊）';
const ODD_TIMES = new Set(['34:56.78','40:39.99','99:99.99']);
const WD = ['日','一','二','三','四','五','六'];
const state = { date:'all', sex:'all', q:'' };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function weekday(date){
  const [y,m,d] = date.split('/').map(Number);
  return WD[new Date(y+1911, m-1, d).getDay()];
}
const dates = [...new Set(ROWS.map(r => r.md))];
const dateFull = md => ROWS.find(r => r.md === md).date;

function match(r, s){
  return (s.date === 'all' || r.md === s.date) &&
         (s.sex === 'all' || r.sex === s.sex) &&
         (!s.q || r.name.includes(s.q));
}
const current = () => ROWS.filter(r => match(r, state));
const countFor = patch => ROWS.filter(r => match(r, Object.assign({}, state, patch))).length;

/* ── 頁首摘要與姓名清單 ── */
(function initStatic(){
  const people = ROWS.filter(r => r.name !== RELAY);
  const uniq = new Set(people.map(r => r.name));
  const relays = ROWS.length - people.length;
  $('#sum').textContent = `共 ${ROWS.length} 筆報名，${uniq.size} 位選手` + (relays ? `，另有 ${relays} 筆接力` : '');
  const cnt = {};
  people.forEach(r => cnt[r.name] = (cnt[r.name]||0) + 1);
  const names = Object.keys(cnt).sort((a,b) => cnt[b]-cnt[a] || a.localeCompare(b,'zh-Hant'));
  $('#names').innerHTML = names.map(n => `<option value="${esc(n)}">${cnt[n]} 項</option>`).join('') + '<option value="接力">接力</option>';
})();

/* ── 篩選按鈕 ── */
function renderSegs(){
  const mk = (val, label, n, pressed) =>
    `<button type="button" data-v="${esc(val)}" aria-pressed="${pressed}"><span>${esc(label)}</span><small>${n}</small></button>`;
  $('#segDate').innerHTML =
    mk('all','全部', countFor({date:'all'}), state.date==='all') +
    dates.map(md => mk(md, `${md} 週${weekday(dateFull(md))}`, countFor({date:md}), state.date===md)).join('');
  $('#segSex').innerHTML =
    mk('all','全部', countFor({sex:'all'}), state.sex==='all') +
    ['男子組','女子組'].map(s => mk(s, s, countFor({sex:s}), state.sex===s)).join('');
}

/* ── 結果 ── */
const isOdd = t => ODD_TIMES.has(t);
function heatCell(r){
  return esc(r.heat) + (r.tot === '未分組' ? '<small>未分組</small>' : '');
}
function renderList(){
  const rows = current();
  const active = state.date!=='all' || state.sex!=='all' || state.q;
  $('#reset').hidden = !active;
  $('#clearQ').hidden = !state.q;
  $('#count').innerHTML = `顯示 <b>${rows.length}</b> 筆` + (active ? `（全部 ${ROWS.length} 筆）` : '');
  if(!rows.length){
    $('#list').innerHTML = `<div class="empty"><b>沒有符合的項目</b>請換一個日期或性別，或清除姓名再試一次。</div>`;
    return;
  }
  let html = '';
  dates.forEach(md => {
    const g = rows.filter(r => r.md === md);
    if(!g.length) return;
    html += `<section class="day"><h2><span class="dd">${md}</span><span class="wd">週${weekday(g[0].date)}</span><span class="n">${g.length} 筆</span></h2>
    <table class="sched"><thead><tr><th>項次</th><th>項目</th><th>組別</th><th>水道</th><th>姓名</th><th style="text-align:right">報名成績</th></tr></thead><tbody>`;
    g.forEach(r => {
      const relay = r.name === RELAY;
      html += `<tr>
        <td class="no">${r.no}</td>
        <td class="ev"><b>${esc(r.item)}</b><span class="sub">${esc(r.age)}<span class="sx ${r.sex==='男子組'?'m':'f'}">${esc(r.sex)}</span></span></td>
        <td class="ht">${heatCell(r)}</td>
        <td class="ln"><span class="plate">${r.lane}</span></td>
        <td class="nm${relay?' relay':''}">${esc(relay?'接力隊':r.name)}</td>
        <td class="tm${isOdd(r.time)?' odd':''}">${esc(r.time)}</td>
      </tr>`;
    });
    html += `</tbody></table></section>`;
  });
  $('#list').innerHTML = html;
}

function syncURL(){
  try{
    const p = new URLSearchParams();
    if(state.date!=='all') p.set('d', state.date);
    if(state.sex!=='all') p.set('s', state.sex==='女子組' ? '女' : '男');
    if(state.q) p.set('q', state.q);
    const qs = p.toString();
    history.replaceState(null, '', qs ? '?'+qs : location.pathname);
  }catch(e){}
}
function update(){ renderSegs(); renderList(); syncURL(); }

$('#segDate').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  state.date = b.dataset.v; update();
});
$('#segSex').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  state.sex = b.dataset.v; update();
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); update(); });
$('#clearQ').addEventListener('click', () => { $('#q').value=''; state.q=''; update(); $('#q').focus(); });
$('#reset').addEventListener('click', () => { state.date='all'; state.sex='all'; state.q=''; $('#q').value=''; update(); });
$('#btnPrint').addEventListener('click', () => window.print());

/* 由網址還原篩選（方便把連結傳給隊員，例如 ?q=邱湘甯） */
(function fromURL(){
  const p = new URLSearchParams(location.search);
  const d = p.get('d'); if(d && dates.includes(d)) state.date = d;
  const s = p.get('s'); if(s==='男') state.sex='男子組'; if(s==='女') state.sex='女子組';
  const q = p.get('q'); if(q){ state.q = q.trim(); $('#q').value = state.q; }
})();
update();

/* ═════════ 下載 PDF / 圖片 ═════════ */
const EXW = 1000;                       // 輸出畫面寬度(px)
function filterSummary(){
  const d = state.date==='all' ? '全部日期' : `${state.date}（週${weekday(dateFull(state.date))}）`;
  const s = state.sex==='all' ? '全部性別' : state.sex;
  const q = state.q ? `姓名：${state.q}` : '全部姓名';
  return `${d}　${s}　${q}`;
}
function fileBase(){
  const parts = ['裕德高中賽程'];
  if(state.date!=='all') parts.push(state.date.replace('/','-'));
  if(state.sex!=='all') parts.push(state.sex);
  if(state.q) parts.push(state.q);
  return parts.join('_');
}
function buildExport(rows){
  let body = '', z = 0;
  dates.forEach(md => {
    const g = rows.filter(r => r.md === md);
    if(!g.length) return;
    body += `<tr class="day"><td colspan="8">${md}（週${weekday(g[0].date)}）<span>${g.length} 筆</span></td></tr>`;
    z = 0;
    g.forEach(r => {
      const relay = r.name === RELAY;
      body += `<tr class="${(z++%2)?'z':''}">
        <td class="c-no">${r.no}</td><td>${esc(r.age)}</td>
        <td class="${r.sex==='男子組'?'m':'f'}">${esc(r.sex)}</td>
        <td class="c-it">${esc(r.item)}</td>
        <td>${esc(r.heat)}${r.tot==='未分組'?'<br><span style="font-size:12px;color:#556d7e">未分組</span>':''}</td>
        <td class="c-ln">${r.lane}</td><td class="c-nm">${esc(relay?'接力隊':r.name)}</td>
        <td class="c-tm${isOdd(r.time)?' odd':''}">${esc(r.time)}</td></tr>`;
    });
  });
  return `<div class="ex">
    <div class="ex-head"><div class="ex-t">裕德高中游泳隊 賽程</div>
      <div class="ex-s">115年全國北區A(2)游泳錦標賽（115/10/02 至 10/04）</div>
      <div class="ex-f">篩選：${esc(filterSummary())}　共 ${rows.length} 筆</div></div>
    <div class="ex-rope"></div>
    <table class="ex-tb"><colgroup><col style="width:6%"><col style="width:13%"><col style="width:9%"><col style="width:20%"><col style="width:12%"><col style="width:7%"><col style="width:18%"><col style="width:15%"></colgroup>
      <thead><tr><th>項次</th><th>歲級</th><th>性別</th><th>項目</th><th>組別</th><th>水道</th><th>姓名</th><th style="text-align:right;padding-right:16px">報名成績</th></tr></thead>
      <tbody>${body}</tbody></table>
    <div class="ex-note">報名時的編排資料，實際出賽組別與水道以大會現場公告為準。灰色報名成績為原網頁預設或異常值，僅供參考。資料來源：中華民國游泳協會(CTSA)，資料擷取日 2026/09/20。</div>
  </div>`;
}

function setBusy(on, msg){
  $('#busy').hidden = !on;
  if(msg) $('#busyMsg').textContent = msg;
  ['#btnPdf','#btnPng','#btnPrint'].forEach(s => $(s).disabled = on);
}

async function renderExport(rows){
  const stage = $('#stage');
  stage.innerHTML = buildExport(rows);
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const H = stage.offsetHeight;
  // 手機瀏覽器的畫布有面積上限，長表格自動降低解析度
  const s = Math.max(0.8, Math.min(2, Math.sqrt(14e6 / (EXW*H)), 15000 / H));
  const canvas = await html2canvas(stage, {
    scale:s, backgroundColor:'#ffffff', useCORS:true, logging:false,
    windowWidth:EXW, windowHeight:H, scrollX:0, scrollY:0
  });
  return { stage, canvas, s, H };
}

function pageBreaks(stage){
  const base = stage.getBoundingClientRect().top;
  const thead = stage.querySelector('thead');
  const headTop = thead.getBoundingClientRect().top - base;
  const headH = thead.offsetHeight;
  const trs = [...stage.querySelectorAll('tbody tr')].map(tr => ({
    top: tr.getBoundingClientRect().top - base, day: tr.classList.contains('day')
  }));
  const total = stage.offsetHeight;
  const pageH = EXW * 277 / 194;        // A4 直式：內容區 194 × 277 mm
  const pages = [];
  let start = 0;
  while(start < total - 1){
    const avail = pages.length ? pageH - headH : pageH;
    const limit = start + avail;
    let end;
    if(limit >= total){ end = total; }
    else{
      let c = -1;
      for(let i=0;i<trs.length;i++){ if(trs[i].top > start+1 && trs[i].top <= limit+0.5) c = i; }
      if(c > 0 && trs[c-1].day && trs[c-1].top > start+1) c--;   // 日期標題不要單獨留在頁尾
      end = c >= 0 ? trs[c].top : limit;
    }
    pages.push([start, end]);
    start = end;
  }
  return { pages, headTop, headH };
}

function savePdf({stage, canvas, s}, name){
  const jsPDF = window.jspdf && window.jspdf.jsPDF;
  if(!jsPDF) throw new Error('PDF 元件尚未載入');
  const { pages, headTop, headH } = pageBreaks(stage);
  const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
  pages.forEach(([a,b], i) => {
    const first = i === 0;
    const hCss = (b - a) + (first ? 0 : headH);
    const pc = document.createElement('canvas');
    pc.width = canvas.width; pc.height = Math.max(1, Math.round(hCss * s));
    const ctx = pc.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,pc.width,pc.height);
    let dy = 0;
    if(!first){                              // 每一頁重複表頭
      const hy = Math.round(headTop*s), hh = Math.min(Math.round(headH*s), canvas.height-hy);
      ctx.drawImage(canvas, 0, hy, canvas.width, hh, 0, 0, canvas.width, hh);
      dy = Math.round(headH*s);
    }
    const sy = Math.round(a*s), sh = Math.min(Math.round((b-a)*s), canvas.height - sy);
    ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, dy, canvas.width, sh);
    if(i) pdf.addPage();
    pdf.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', 8, 8, 194, hCss * 194 / EXW);
    pdf.setFontSize(8); pdf.setTextColor(120);
    pdf.text(`${i+1} / ${pages.length}`, 105, 291, {align:'center'});
  });
  pdf.save(name + '.pdf');
}

function savePng({canvas}, name){
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if(!blob){ reject(new Error('圖片產生失敗，請縮小篩選範圍後再試')); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      resolve();
    }, 'image/png');
  });
}

async function exportAs(kind){
  const rows = current();
  if(!rows.length){ alert('目前沒有符合的項目可以下載，請先調整篩選條件。'); return; }
  if(!window.html2canvas){ alert('下載元件沒有載入成功，請確認網路連線後重新整理，或改用「列印」另存成 PDF。'); return; }
  const y = window.scrollY;
  window.scrollTo(0,0);
  setBusy(true, kind==='pdf' ? '正在產生 PDF…' : '正在產生圖片…');
  try{
    await new Promise(r => setTimeout(r, 60));
    const res = await renderExport(rows);
    if(kind==='pdf') savePdf(res, fileBase()); else await savePng(res, fileBase());
  }catch(err){
    console.error(err);
    alert('下載失敗：' + err.message + '\n可以縮小篩選範圍再試，或改用「列印」另存成 PDF。');
  }finally{
    $('#stage').innerHTML = '';
    setBusy(false);
    window.scrollTo(0,y);
  }
}
$('#btnPdf').addEventListener('click', () => exportAs('pdf'));
$('#btnPng').addEventListener('click', () => exportAs('png'));
</script>
